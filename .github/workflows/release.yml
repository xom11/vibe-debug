name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Verify signing secrets are configured
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for var in SIGNING_KEY_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Missing required repository secret: $var" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "${{ runner.temp }}/release-keystore.jks"

      - name: Build signed APK, AAB, run tests, and lint
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease lintVitalRelease

      - name: Prepare release artifacts
        id: artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/vibe-debug-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/vibe-debug-${VERSION}.aab"
          (cd dist && sha256sum "vibe-debug-${VERSION}.apk" "vibe-debug-${VERSION}.aab" > SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist/vibe-debug-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "aab_path=dist/vibe-debug-${VERSION}.aab" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact (for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab-${{ steps.artifacts.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.aab_path }}
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            dist/SHA256SUMS.txt
